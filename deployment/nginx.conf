# nginx running inside a container, published on a non-default port (8080).
#
# Key correctness rules baked in below:
#  * `absolute_redirect off` — auto-generated redirects must not drop the port
#    and escape to a different host.
#  * `resolver 127.0.0.11 valid=10s` with variables in `proxy_pass` — nginx
#    must start even if an upstream container is momentarily down.
#  * `client_max_body_size 100M` and `proxy_read_timeout 300s` on API routes
#    so slow uploads surface real errors instead of 504s.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker embedded DNS. valid=10s so nginx keeps starting when a container is
  # briefly missing, and picks it up as soon as it appears.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Prevent auto-generated 301s from dropping the container's published port.
  absolute_redirect off;
  server_name_in_redirect off;
  port_in_redirect on;

  # Upstream hostnames as variables so nginx doesn't fail to start when a
  # container isn't up yet — it resolves them lazily per request.
  map $host $backend_upstream    { default backend:8000; }
  map $host $upload_ui_upstream  { default upload-ui:80; }
  map $host $query_ui_upstream   { default query-ui:80; }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 100M;

    location /api/ {
      proxy_pass         http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 100M;
    }

    location = /health {
      proxy_pass         http://$backend_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # Query UI mounted under /query/ (Vite base path).
    location /query/ {
      proxy_pass         http://$query_ui_upstream/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Upload UI at the root.
    location / {
      proxy_pass         http://$upload_ui_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
